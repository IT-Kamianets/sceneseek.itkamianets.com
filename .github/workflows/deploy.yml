name: Deploy to GitHub Pages

on:
    push:
        branches:
            - master
    schedule:
        - cron: '17 */12 * * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: deploy-github-pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Install Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: '24.15.0'

            - name: Install dependencies
              run: npm ci

            - name: Refresh Coverr recommendations
              if: github.event_name != 'push'
              env:
                  COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
              run: node tools/update-coverr-recommendations.mjs

            - name: Save refreshed recommendations to master
              if: github.event_name != 'push'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add src/assets/data/coverr-popular.json
                  if ! git diff --cached --quiet; then
                    git commit -m "chore: refresh Coverr recommendations"
                    git push origin HEAD:master
                  else
                    echo "Coverr recommendations are unchanged."
                  fi

            - name: Rebuild lightningcss
              run: npm rebuild lightningcss

            - name: Build Angular app
              run: npm run build

            - name: Copy CNAME file
              run: cp CNAME dist/app/browser/

            - name: Add SPA fallback for GitHub Pages route reload
              run: cp dist/app/browser/index.html dist/app/browser/404.html

            - name: Set up SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts

            - name: Commit and push to gh-pages using SSH
              env:
                  GIT_SSH_COMMAND: 'ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no'
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  cd dist/app/browser
                  git init  # Initialize a new git repository
                  git add --all .  # Add all changes
                  git commit -m "Deploy to GitHub Pages"
                  git checkout -B gh-pages  # Switch to gh-pages branch
                  git push git@github.com:${{ github.repository }} gh-pages --force

            - name: Clean up SSH
              run: |
                  rm -f ~/.ssh/id_rsa
                  rm -f ~/.ssh/known_hosts

@if (prompt.isOpen()) {
	<div class="auth-prompt" (click)="closeFromBackdrop($event)" (keydown.escape)="prompt.close()">
		<section
			class="auth-prompt__dialog"
			role="dialog"
			aria-modal="true"
			aria-labelledby="auth-prompt-title"
			aria-describedby="auth-prompt-description"
		>
			<div class="auth-prompt__topline">
				<span class="auth-prompt__icon" aria-hidden="true">
					<span class="material-symbols-outlined">lock</span>
				</span>
				<button [translate]="{ ariaLabel: 'Close sign-in dialog' }"
					class="auth-prompt__close"
					type="button"
					aria-label="Close sign-in dialog"
					(click)="prompt.close()"
				>
					<span class="material-symbols-outlined" aria-hidden="true">close</span>
				</button>
			</div>

			<p class="auth-prompt__eyebrow">SceneSeek</p>
			<h2 id="auth-prompt-title"><span translate>Sign in to SceneSeek</span></h2>
			<p class="auth-prompt__description" id="auth-prompt-description">
				@if (prompt.reason() === 'history') {
					<span translate>Sign in or create an account to view your search history.</span>
				} @else {
					<span translate>Sign in or create an account to save scenes to your collection.</span>
				}
			</p>

			<div class="auth-prompt__actions">
				<a class="auth-prompt__button auth-prompt__button--primary" routerLink="/auth/login" [queryParams]="{ returnUrl: prompt.reason() === 'history' ? '/history' : '/saved' }" (click)="prompt.close()">
					<span translate>Sign in</span>
				</a>
				<a class="auth-prompt__button auth-prompt__button--secondary" routerLink="/auth/register" [queryParams]="{ returnUrl: prompt.reason() === 'history' ? '/history' : '/saved' }" (click)="prompt.close()">
					<span translate>Create account</span>
				</a>
			</div>

			<button class="auth-prompt__dismiss" type="button" (click)="prompt.close()">
				<span translate>Continue without an account</span>
			</button>
		</section>
	</div>
}

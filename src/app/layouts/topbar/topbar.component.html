<header
	class="relative z-50 border-b border-[var(--c-border)] bg-[var(--c-bg-secondary)]/95 backdrop-blur supports-[backdrop-filter]:bg-[var(--c-bg-secondary)]/80"
>
	<div
		class="mx-auto flex min-h-16 w-full max-w-[var(--container)] items-center justify-between overflow-visible px-4 py-3 sm:px-6"
	>
		<a
			[translate]="{ ariaLabel: 'Go to homepage' }"
			class="inline-flex items-center gap-3"
			routerLink="/"
		>
			<span
				class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl"
			>
				<img
					class="h-full w-full rounded-xl object-cover"
					[translate]="{ alt: 'Project logo' }"
					ngSrc="sceneseek-logo.jpg"
					width="40"
					height="40"
					priority
				/>
			</span>
			@if (company().name) {
				<span class="hidden text-sm font-semibold text-[var(--c-text-strong)] sm:inline">
					{{ company().name }}
				</span>
			}
		</a>

		<div class="flex items-center gap-2">
			<div
				class="relative flex items-center gap-1 rounded-[var(--radius)] border border-[var(--c-border)] bg-[var(--surface-bezel)] p-1 shadow-[var(--shadow-sm)]"
			>
				<button
					class="theme-interactive theme-focus inline-flex h-9 items-center gap-2 rounded-[var(--radius-btn)] px-3 text-sm font-medium text-[var(--c-text)] hover:bg-[var(--c-bg-tertiary)]"
					[attr.aria-label]="languageCycleLabel()"
					(click)="nextLanguage()"
					type="button"
				>
					<img
						class="h-5 w-7 rounded-[4px] border border-black/10 object-cover"
						[alt]="currentLanguage().nativeName"
						[ngSrc]="currentLanguage().flagSrc"
						width="28"
						height="20"
					/>
				</button>

				<button
					class="theme-interactive theme-focus inline-flex h-9 w-9 items-center justify-center rounded-[var(--radius-btn)] text-[var(--c-text-strong)] hover:bg-[var(--c-bg-tertiary)]"
					[attr.aria-expanded]="languageMenuOpen()"
					[attr.aria-label]="languageMenuLabel()"
					(click)="toggleLanguageMenu()"
					type="button"
				>
					<span class="material-symbols-outlined text-[20px]" aria-hidden="true">
						arrow_drop_down
					</span>
				</button>

				@if (languageMenuOpen()) {
					<div
						class="absolute right-0 top-[calc(100%+0.5rem)] z-50 min-w-48 overflow-hidden rounded-[var(--radius)] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] p-1 shadow-[var(--shadow-md)]"
					>
						@for (language of languages(); track language.code) {
							<button
								class="theme-interactive theme-focus flex w-full items-center gap-3 rounded-[calc(var(--radius-btn)-0.25rem)] px-3 py-2 text-left text-sm text-[var(--c-text)] hover:bg-[var(--c-bg-tertiary)]"
								(click)="setLanguage(language)"
								type="button"
							>
								<img
									class="h-5 w-7 rounded-[4px] border border-black/10 object-cover"
									[alt]="language.nativeName"
									[ngSrc]="language.flagSrc"
									width="28"
									height="20"
								/>
								<span>{{ language.nativeName }}</span>
							</button>
						}
					</div>
				}
			</div>

			<button
				class="theme-interactive theme-focus inline-flex h-11 w-11 items-center justify-center rounded-[var(--radius-btn)] border border-[var(--c-border)] bg-[var(--c-bg-secondary)] text-[var(--c-text-strong)] hover:bg-[var(--c-bg-tertiary)]"
				[attr.aria-label]="toggleLabel()"
				(click)="toggleMode()"
				type="button"
			>
				<span class="material-symbols-outlined text-[22px]" aria-hidden="true">
					{{ toggleIcon() }}
				</span>
			</button>
		</div>
	</div>
</header>

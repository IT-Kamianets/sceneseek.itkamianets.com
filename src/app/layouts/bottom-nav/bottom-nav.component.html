<aside class="sidebar">
	<nav [translate]="{ ariaLabel: 'Main navigation' }" class="sidebar__nav" aria-label="Main navigation">
		<a [translate]="{ ariaLabel: 'Explore' }"
			class="sidebar__link"
			routerLink="/"
			routerLinkActive="is-active"
			[routerLinkActiveOptions]="{ exact: true }"
			ariaCurrentWhenActive="page"
			aria-label="Explore"
		>
			<span class="material-symbols-outlined" aria-hidden="true">explore</span>
			<span class="sidebar__tooltip" role="tooltip"><span translate>Explore</span></span>
		</a>

		<a [translate]="{ ariaLabel: 'Search' }"
			class="sidebar__link"
			routerLink="/search"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Search"
		>
			<span class="material-symbols-outlined" aria-hidden="true">search</span>
			<span class="sidebar__tooltip" role="tooltip"><span translate>Search</span></span>
		</a>

		<a [translate]="{ ariaLabel: 'AI agent' }"
			class="sidebar__link"
			routerLink="/agent"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="AI agent"
		>
			<span class="material-symbols-outlined" aria-hidden="true">smart_toy</span>
			<span class="sidebar__tooltip" role="tooltip"><span translate>AI agent</span></span>
		</a>

		<a [translate]="{ ariaLabel: 'Saved' }"
			class="sidebar__link"
			routerLink="/saved"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Saved"
			(click)="promptForSignIn('saved')"
		>
			<span class="material-symbols-outlined" aria-hidden="true">bookmarks</span>
			<span class="sidebar__tooltip" role="tooltip"><span translate>Saved</span></span>
		</a>

		<a [translate]="{ ariaLabel: 'Profile' }"
			class="sidebar__link"
			routerLink="/profile"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Profile"
		>
			<span class="material-symbols-outlined" aria-hidden="true">person</span>
			<span class="sidebar__tooltip" role="tooltip"><span translate>Profile</span></span>
		</a>
	</nav>
</aside>

<aside class="sidebar">
	<nav class="sidebar__nav" aria-label="Main navigation">
		<a
			class="sidebar__link"
			routerLink="/"
			routerLinkActive="is-active"
			[routerLinkActiveOptions]="{ exact: true }"
			ariaCurrentWhenActive="page"
			aria-label="Explore"
		>
			<span class="material-symbols-outlined" aria-hidden="true">explore</span>
			<span class="sidebar__tooltip" role="tooltip">Explore</span>
		</a>

		<a
			class="sidebar__link"
			routerLink="/search"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Search"
		>
			<span class="material-symbols-outlined" aria-hidden="true">search</span>
			<span class="sidebar__tooltip" role="tooltip">Search</span>
		</a>

		<a
			class="sidebar__link"
			routerLink="/history"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="History"
			(click)="promptForSignIn('history')"
		>
			<span class="material-symbols-outlined" aria-hidden="true">history</span>
			<span class="sidebar__tooltip" role="tooltip">History</span>
		</a>

		<a
			class="sidebar__link"
			routerLink="/saved"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Saved"
			(click)="promptForSignIn('saved')"
		>
			<span class="material-symbols-outlined" aria-hidden="true">bookmarks</span>
			<span class="sidebar__tooltip" role="tooltip">Saved</span>
		</a>

		<a
			class="sidebar__link"
			routerLink="/profile"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Profile"
		>
			<span class="material-symbols-outlined" aria-hidden="true">person</span>
			<span class="sidebar__tooltip" role="tooltip">Profile</span>
		</a>
	</nav>
</aside>

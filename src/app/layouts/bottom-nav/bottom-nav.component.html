<aside class="sidebar">
	<nav class="sidebar__nav" aria-label="Основна навігація">
		<a
			class="sidebar__link"
			routerLink="/"
			routerLinkActive="is-active"
			[routerLinkActiveOptions]="{ exact: true }"
			ariaCurrentWhenActive="page"
			aria-label="Огляд"
		>
			<span class="material-symbols-outlined" aria-hidden="true">explore</span>
			<span class="sidebar__tooltip" role="tooltip">Огляд</span>
		</a>

		<a
			class="sidebar__link"
			routerLink="/search"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Пошук"
		>
			<span class="material-symbols-outlined" aria-hidden="true">search</span>
			<span class="sidebar__tooltip" role="tooltip">Пошук</span>
		</a>

		<a
			class="sidebar__link"
			routerLink="/history"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Історія"
			(click)="promptForSignIn('history')"
		>
			<span class="material-symbols-outlined" aria-hidden="true">history</span>
			<span class="sidebar__tooltip" role="tooltip">Історія</span>
		</a>

		<a
			class="sidebar__link"
			routerLink="/saved"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Збережене"
			(click)="promptForSignIn('saved')"
		>
			<span class="material-symbols-outlined" aria-hidden="true">bookmarks</span>
			<span class="sidebar__tooltip" role="tooltip">Збережене</span>
		</a>

		<a
			class="sidebar__link"
			routerLink="/profile"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Профіль"
		>
			<span class="material-symbols-outlined" aria-hidden="true">person</span>
			<span class="sidebar__tooltip" role="tooltip">Профіль</span>
		</a>
	</nav>
</aside>

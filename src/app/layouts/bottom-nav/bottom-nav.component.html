<aside class="sidebar" [class.sidebar--expanded]="expanded()">
	<nav class="sidebar__nav" aria-label="Основна навігація">
		<a
			class="sidebar__link"
			routerLink="/"
			routerLinkActive="is-active"
			[routerLinkActiveOptions]="{ exact: true }"
			ariaCurrentWhenActive="page"
			aria-label="Огляд"
			title="Огляд"
		>
			<span class="material-symbols-outlined" aria-hidden="true">explore</span>
			@if (expanded()) { <span>Огляд</span> }
		</a>

		<a
			class="sidebar__link"
			routerLink="/search"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Пошук"
			title="Пошук"
		>
			<span class="material-symbols-outlined" aria-hidden="true">search</span>
			@if (expanded()) { <span>Пошук</span> }
		</a>

		<a
			class="sidebar__link"
			routerLink="/history"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Історія"
			title="Історія"
			(click)="promptForSignIn('history')"
		>
			<span class="material-symbols-outlined" aria-hidden="true">history</span>
			@if (expanded()) { <span>Історія</span> }
		</a>

		<a
			class="sidebar__link"
			routerLink="/saved"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Збережене"
			title="Збережене"
			(click)="promptForSignIn('saved')"
		>
			<span class="material-symbols-outlined" aria-hidden="true">bookmarks</span>
			@if (expanded()) { <span>Збережене</span> }
		</a>

		<a
			class="sidebar__link"
			routerLink="/profile"
			routerLinkActive="is-active"
			ariaCurrentWhenActive="page"
			aria-label="Профіль"
			title="Профіль"
		>
			<span class="material-symbols-outlined" aria-hidden="true">person</span>
			@if (expanded()) { <span>Профіль</span> }
		</a>
	</nav>

	<button
		class="sidebar__toggle"
		type="button"
		[attr.aria-expanded]="expanded()"
		[attr.aria-label]="expanded() ? 'Згорнути меню' : 'Розгорнути меню'"
		(click)="toggleExpanded()"
	>
		<span class="material-symbols-outlined" aria-hidden="true">
			{{ expanded() ? 'left_panel_close' : 'left_panel_open' }}
		</span>
		@if (expanded()) { <span>Згорнути меню</span> }
	</button>
</aside>
